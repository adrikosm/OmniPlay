included:
  - App
  - Packages
  - Runtimes
  - Tests
excluded:
  - .build
  - "**/.build"
  - Engines
  - docs
  - Fixtures
opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
disabled_rules:
  - todo
  - trailing_comma        # Swift 6 style: trailing commas in multi-line literals are intentional
line_length:
  warning: 140
  error: 200
identifier_name:
  min_length: 1           # a/b/x/y controller buttons, x/y coordinates, short test locals
  max_length: 50
type_name:
  allowed_symbols: ["_"]
cyclomatic_complexity:
  ignores_case_statements: true   # exhaustive switches over state enums are the readable form
function_parameter_count:
  warning: 7
  error: 9
type_body_length:
  warning: 350
  error: 500
function_body_length:
  warning: 60
  error: 100
