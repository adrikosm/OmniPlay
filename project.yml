# xcodegen spec. OmniPlay.xcodeproj is generated (Scripts/generate-project.sh) and gitignored.
name: OmniPlay
options:
  bundleIdPrefix: com.omniplay
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    TARGETED_DEVICE_FAMILY: "1"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    # Empty means core capabilities only; opt into memory entitlements in Signing.xcconfig.
    OMNIPLAY_ENTITLEMENTS_FILE: ""
    OMNIPLAY_BUNDLE_IDENTIFIER: com.omniplay.app
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

# Local packages. None may import SwiftUI; only InputKit and RuntimeCore may import UIKit
# (Scripts/check-no-ui-imports.sh runs before every build).
packages:
  GameCore:        { path: Packages/GameCore }
  Diagnostics:     { path: Packages/Diagnostics }
  GameStore:       { path: Packages/GameStore }
  OverlayVFS:      { path: Packages/OverlayVFS }
  GameImport:      { path: Packages/GameImport }
  GameDetection:   { path: Packages/GameDetection }
  RuntimeCore:     { path: Packages/RuntimeCore }
  SaveKit:         { path: Packages/SaveKit }
  RGSSRuntime:     { path: Packages/RGSSRuntime }
  RenPyRuntime:    { path: Packages/RenPyRuntime }
  EasyRPGRuntime:  { path: Packages/EasyRPGRuntime }
  ScummVMRuntime:  { path: Packages/ScummVMRuntime }
  GodotRuntime:    { path: Packages/GodotRuntime }
  InputKit:        { path: Packages/InputKit }
  MediaCompat:     { path: Packages/MediaCompat }
  MediaTranscode:  { path: Packages/MediaTranscode }
  LocalGameServer: { path: Packages/LocalGameServer }
  GameTools:       { path: Packages/GameTools }

targets:
  OmniPlay:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Info.plist", "OmniPlay.entitlements"]
      - path: THIRD-PARTY-LICENSES.txt
        buildPhase: resources
      - path: LICENSES
        buildPhase: resources
        type: folder
      # Engine runtime files, hydrated by Scripts/native. Both names are the engine's own: it reads shaders,
      # fonts and preload/postload Ruby from <bundle>/Assets.bundle and the Ruby stdlib from <bundle>/Ruby.
      - path: Native/prebuilt/rgss-assets/Assets.bundle
        buildPhase: resources
        type: folder
      - path: Native/prebuilt/rgss-assets/Ruby
        buildPhase: resources
        type: folder
      # KiriKiri: the KrKr2 Web engine page and WebAssembly (Scripts/native/build-kirikiri.sh), served as a layer.
      - path: Native/prebuilt/kirikiri/KrKr2Web
        buildPhase: resources
        type: folder
        optional: true
      # RPG Maker RTPs copied from the owner's own extracted copies (Scripts/native/bundle-rtp.sh), never committed;
      # a player's own import still wins. Absent, RTP games ask for an import as before.
      - path: Native/prebuilt/rtp/RTP
        buildPhase: resources
        type: folder
        optional: true
      # MIDI for RPG Maker XP/VX: the default soundfont (Scripts/native/build-fluidsynth.sh).
      - path: Native/prebuilt/soundfont/GeneralUser-GS.sf2
        buildPhase: resources
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    dependencies:
      - package: GameCore
      - package: Diagnostics
      - package: GameStore
      - package: OverlayVFS
      - package: GameImport
      - package: GameDetection
      - package: RuntimeCore
      - package: SaveKit
      - package: RGSSRuntime
      - package: RenPyRuntime
      - package: EasyRPGRuntime
      - package: ScummVMRuntime
      - package: GodotRuntime
      - package: InputKit
      - package: MediaCompat
      - package: MediaTranscode
      - package: LocalGameServer
      - package: GameTools
      # Ren'Py engines are embedded, never linked: RenPyEngineLibrary opens each on the first launch that needs
      # it. MetalANGLE is the GLES layer all three link through @rpath.
      - framework: Native/prebuilt/renpy/metalangle/MetalANGLE.xcframework
        embed: true
        link: false
      - framework: Native/prebuilt/renpy/8.5.3/RenPy853.xcframework
        embed: true
        link: false
      - framework: Native/prebuilt/renpy/8.3.7/RenPy837.xcframework
        embed: true
        link: false
      - framework: Native/prebuilt/renpy/7.8.7/RenPy787.xcframework
        embed: true
        link: false
      # EasyRPG Player (RPG Maker 2000/2003), embedded the same way and opened on the first 2000/2003 launch.
      - framework: Native/prebuilt/easyrpg/EasyRPG.xcframework
        embed: true
        link: false
      # ScummVM (adventure games, interactive fiction), embedded the same way, with its engine data inside.
      - framework: Native/prebuilt/scummvm/ScummVM.xcframework
        embed: true
        link: false
      # Godot 4 (imported .pck exports), embedded the same way.
      - framework: Native/prebuilt/godot/Godot.xcframework
        embed: true
        link: false
      - framework: Native/prebuilt/godot44/Godot44.xcframework
        embed: true
        link: false
      - framework: Native/prebuilt/godot3/Godot3.xcframework
        embed: true
        link: false
      # mkxp-z opens @rpath/libfluidsynth.dylib itself on the first MIDI it plays.
      - framework: Native/prebuilt/fluidsynth/libfluidsynth.xcframework
        embed: true
        link: false
    preBuildScripts:
      - name: Check no UI imports in packages
        script: "\"$SRCROOT/Scripts/check-no-ui-imports.sh\""
        basedOnDependencyAnalysis: false
      - name: Check no engine checks in Game Tools views
        script: "\"$SRCROOT/Scripts/check-no-engine-checks-in-views.sh\""
        basedOnDependencyAnalysis: false
      - name: Hydrate native deps
        script: "\"$SRCROOT/Scripts/native/hydrate.sh\""
        basedOnDependencyAnalysis: false
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: OmniPlay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.games
        LSSupportsGameMode: true
        GCSupportsControllerUserInteraction: true
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Unlocks the hidden shelf of your library.
        NSPhotoLibraryAddUsageDescription: Screenshots you take from the pause menu are saved to your photos.
        NSLocalNetworkUsageDescription: Wi-Fi upload serves a page on your local network so a computer can send a game folder to this device.
        NSBonjourServices:
          - _omniplay._tcp
        # Scene lifecycle (mandatory with the iOS 27 SDK); SwiftUI App owns the scenes.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Games, RTPs and soundfonts arrive through Files / Finder; loopback only for the local server.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # Web games are served from http://127.0.0.1, so a page's protocol-relative CDN script (jQuery from
          # //ajax.googleapis.com) became plain http and ATS refused it. Web content only; OmniPlay's own code is unchanged.
          NSAllowsArbitraryLoadsInWebContent: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Game distribution
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.zip-archive
              - org.7-zip.7-zip-archive
              - com.rarlab.rar-archive
              - com.microsoft.windows-executable
              - org.godotengine.pck
              - com.adobe.shockwave-flash
              - app.omniplay.jgp
              - org.love2d.love
              - public.folder
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.7-zip.7-zip-archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeDescription: 7-Zip archive
            UTTypeTagSpecification: { public.filename-extension: [7z] }
          - UTTypeIdentifier: com.rarlab.rar-archive
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeDescription: RAR archive
            UTTypeTagSpecification: { public.filename-extension: [rar] }
          - UTTypeIdentifier: com.microsoft.windows-executable
            UTTypeConformsTo: [public.data, public.executable]
            UTTypeDescription: Windows executable
            UTTypeTagSpecification: { public.filename-extension: [exe] }
          - UTTypeIdentifier: org.godotengine.pck
            UTTypeConformsTo: [public.data]
            UTTypeDescription: Godot package
            UTTypeTagSpecification: { public.filename-extension: [pck] }
          - UTTypeIdentifier: com.adobe.shockwave-flash
            UTTypeConformsTo: [public.data]
            UTTypeDescription: Flash movie
            UTTypeTagSpecification: { public.filename-extension: [swf] }
          - UTTypeIdentifier: app.omniplay.jgp
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeDescription: JoiPlay game package
            UTTypeTagSpecification: { public.filename-extension: [jgp] }
          - UTTypeIdentifier: org.love2d.love
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeDescription: LÖVE game
            UTTypeTagSpecification: { public.filename-extension: [love] }
    # The existing entitlements plist is opt-in through OMNIPLAY_ENTITLEMENTS_FILE.
    settings:
      base:
        OTHER_LDFLAGS[sdk=iphonesimulator*]:
          - -Wl,-force_load,$(SRCROOT)/Native/prebuilt/mkxp-z/iphonesimulator-arm64/libmkxpz-core.a
          - $(SRCROOT)/Native/prebuilt/mkxp-z/iphonesimulator-arm64/mkxp18-merged.o
          - $(SRCROOT)/Native/prebuilt/mkxp-z/iphonesimulator-arm64/mkxp19-merged.o
          - $(SRCROOT)/Native/prebuilt/mkxp-z/iphonesimulator-arm64/mkxp31-merged.o
          - -lSDL2
          - -lSDL2_image
          - -lSDL2_sound
          - -lSDL2_ttf
          - -lfreetype
          - -lpixman-1
          - -lpng16
          - -logg
          - -lvorbis
          - -lvorbisfile
          - -ltheora
          - -ltheoradec
          # FFmpeg for media preparation (Scripts/native/build-ffmpeg.sh) and the Theora/Vorbis encoders it uses.
          - -lavformat
          - -lavcodec
          - -lswscale
          - -lswresample
          - -lavutil
          - -ldav1d
          - -ltheoraenc
          - -lvorbisenc
          - -lphysfs
          - -luchardet
          - -lopenal
          - -lssl
          - -lcrypto
          - -lz
          - -lbz2
          - -liconv
          - -lANGLE_static
          - -lEGL_static
          - -lGLESv2_static
          - -framework
          - Foundation
          - -framework
          - UIKit
          - -framework
          - CoreFoundation
          - -framework
          - CoreGraphics
          - -framework
          - CoreVideo
          - -framework
          - CoreAudio
          - -framework
          - AudioToolbox
          - -framework
          - VideoToolbox
          - -framework
          - CoreMedia
          - -framework
          - AVFoundation
          - -framework
          - Metal
          - -framework
          - QuartzCore
          - -framework
          - GameController
          - -framework
          - CoreMotion
          - -framework
          - IOSurface
          - -weak_framework
          - CoreBluetooth
          - -weak_framework
          - CoreHaptics
          - -weak_framework
          - OpenGLES
        OTHER_LDFLAGS[sdk=iphoneos*]:
          - -Wl,-force_load,$(SRCROOT)/Native/prebuilt/mkxp-z/iphoneos-arm64/libmkxpz-core.a
          - $(SRCROOT)/Native/prebuilt/mkxp-z/iphoneos-arm64/mkxp18-merged.o
          - $(SRCROOT)/Native/prebuilt/mkxp-z/iphoneos-arm64/mkxp19-merged.o
          - $(SRCROOT)/Native/prebuilt/mkxp-z/iphoneos-arm64/mkxp31-merged.o
          - -lSDL2
          - -lSDL2_image
          - -lSDL2_sound
          - -lSDL2_ttf
          - -lfreetype
          - -lpixman-1
          - -lpng16
          - -logg
          - -lvorbis
          - -lvorbisfile
          - -ltheora
          - -ltheoradec
          # FFmpeg for media preparation (Scripts/native/build-ffmpeg.sh) and the Theora/Vorbis encoders it uses.
          - -lavformat
          - -lavcodec
          - -lswscale
          - -lswresample
          - -lavutil
          - -ldav1d
          - -ltheoraenc
          - -lvorbisenc
          - -lphysfs
          - -luchardet
          - -lopenal
          - -lssl
          - -lcrypto
          - -lz
          - -lbz2
          - -liconv
          - -lANGLE_static
          - -lEGL_static
          - -lGLESv2_static
          - -framework
          - Foundation
          - -framework
          - UIKit
          - -framework
          - CoreFoundation
          - -framework
          - CoreGraphics
          - -framework
          - CoreVideo
          - -framework
          - CoreAudio
          - -framework
          - AudioToolbox
          - -framework
          - VideoToolbox
          - -framework
          - CoreMedia
          - -framework
          - AVFoundation
          - -framework
          - Metal
          - -framework
          - QuartzCore
          - -framework
          - GameController
          - -framework
          - CoreMotion
          - -framework
          - IOSurface
          - -weak_framework
          - CoreBluetooth
          - -weak_framework
          - CoreHaptics
          - -weak_framework
          - OpenGLES
        LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]:
          - $(inherited)
          - $(SRCROOT)/Native/prebuilt/ffmpeg/iphonesimulator/lib
          - $(SRCROOT)/Native/prebuilt/mkxp-z/iphonesimulator-arm64/deps/lib
          - $(SRCROOT)/Native/prebuilt/mkxp-z/iphonesimulator-arm64/deps/angle-lib
        LIBRARY_SEARCH_PATHS[sdk=iphoneos*]:
          - $(inherited)
          - $(SRCROOT)/Native/prebuilt/ffmpeg/iphoneos/lib
          - $(SRCROOT)/Native/prebuilt/mkxp-z/iphoneos-arm64/deps/lib
          - $(SRCROOT)/Native/prebuilt/mkxp-z/iphoneos-arm64/deps/angle-lib
        PRODUCT_BUNDLE_IDENTIFIER: $(OMNIPLAY_BUNDLE_IDENTIFIER)
        CODE_SIGN_ENTITLEMENTS: $(OMNIPLAY_ENTITLEMENTS_FILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  OmniPlayTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/OmniPlayTests]
    dependencies:
      - target: OmniPlay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omniplay.app.tests
        GENERATE_INFOPLIST_FILE: YES

  OmniPlayUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/OmniPlayUITests]
    dependencies:
      - target: OmniPlay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omniplay.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OmniPlay

schemes:
  OmniPlay:
    build:
      targets:
        OmniPlay: all
        OmniPlayTests: [test]
        OmniPlayUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets: [OmniPlayTests, OmniPlayUITests]
    archive:
      config: Release
